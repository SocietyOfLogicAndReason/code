<div class="tabcontent" id="about">

  <p style="text-indent: 20px;">Hi There! Welcome to the Society of Logic and Reason. The number of people who reject the Christian faith and accept other worldviews is continuously growing because of a lack of important foundational truths. And along with the skepticism comes a broadening amount of worldviews and ideas, such as Naturalism, Materialism, Postmodernism, and many more. It is our mission to equip ourselves and others with the primary truths of Christianity and respectfully point out the flaws in other worldviews.</p>

  <h3>Core Values</h3>
  <p style="text-indent: 20px;">The Society of Logic and Reason is founded and governed by logic, which is right thinking. All things that SOLAR occupants decide for the club, be it moral or opinionated, shall be dictated by correct reasoning, using logic. That is to say, one cannot be perfectly logical, because logic (correct thinking) is based on God. God is the only one perfectly logical in all he does. And since we are not God, we are not perfectly logical. However, this does not mean we should not try to be logical. God calls us to be like Him. So we should try to be logical in everything we do.</p>

  <h3>Mission statement</h3>
  <p style="text-indent: 20px;">Mature in knowledge and wisdom of logic and the Bible, equipping ourselves to stand up for moral values, uphold a Biblical worldview, and ultimately defend truth.</p>
  <p class="scripture">1 Peter 3:15 “But in your hearts honor Christ the Lord as holy, always being prepared to make a defense to anyone who asks you for a reason for the hope that is in you; yet do it with gentleness and respect.”</p>
  <p class="scripture">Titus 2:6-8 “Likewise, urge the younger men to be self-controlled. Show yourself in all respects to be a model of good works, and in your teaching show integrity, dignity, and sound speech that cannot be condemned, so that an opponent may be put to shame, having nothing evil to say about us.”</p>

  <h3>WHO are we?</h3>
  <p style="text-indent: 20px;">We are The Society of Logic and Reason, or SOLAR. We are a group of homeschooled, conservative christian young men co-founded by Lincoln, Lucas, Sammy. <a href="#" onclick="goToMembers(event)">All Members</a>.
  To become a member you must be invited by a current member, agree with our Terms and Conditions, and the supermajority of SOLAR members must vote for you to join.</p>

  <h3>WHAT do we do?</h3>
  <p style="text-indent: 20px;">We meet to learn logic, reasoning, critical thinking and apologetics, to use for defending the Truth. Our first step is to examine what we believe and why we believe it, follow the evidence where it leads, and equip ourselves for defending the Truth. With the knowledge we gain, we defend our position in articles and videos.</p>

  <h3>WHAT do we believe?</h3>
  <p>We believe in Jesus Christ, the son of God
  <br>We affirm the
  <a href="apostlescreed.html">Apostles Creed</a>
  and
  <a href="nicenecreed.html">Nicene Creed</a>.
  <br>We believe that “all Scripture is given by inspiration of God.” (2 Timothy 3:16)
  <br>We believe in creation and oppose evolution.
  <br>We believe abortion is murder.
  <br>We believe marriage is between one man and one woman for life.(Matthew19:5)
  <br>We believe God created them male and female.(Genesis 1:27)</p>

  <h3>WHEN did we start?</h3>
  <p>Spring 2025</p>

  <h3>WHERE do we live?</h3>
  <p>We are from the Great Lakes Region.</p>

  <h3>WHY do we exist?</h3>
  <p style="text-indent: 20px;">So many people are led astray by errors world views, false beliefs, false assumptions and misinterpretations of evidences,  for whatever reason people believe theses things, they lead to unfulfilled lives, broken relationships, murder, selfishness, wickedness and eventually hell.
  We exist to get people to come back to there creator, to show them there error and present to them the Truth.</p>
  <p class="scripture">“For this is good and acceptable in the sight of God our Savior, who desires all men to be saved and to come to the knowledge of the truth.” 1 Timothy 2:3-4</p>

  <p class="note">All articles, notes, and other content was creatively written by real human beings. The code layout of this website was created using AI</p>

function key(e){

 if(e.ctrlKey&&e.shiftKey&&K.length==1&&C[k]){e.preventDefault();document.execCommand('styleWithCSS',false,true);document.execCommand('foreColor',false,C[k]);return}
 if(e.ctrlKey&&!e.shiftKey&&!e.altKey&&/^Arrow(Left|Right|Up|Down)$/.test(K)){
  e.preventDefault();const v=K=='ArrowLeft'||K=='ArrowRight',d=(K=='ArrowRight'||K=='ArrowDown')?1:-1;
  if(!ph||ph.v!=v)ph={v,i,part,p:v?.5:(D.h==null?50:D.h)};
  ph.p=v?Math.max(.05,Math.min(.95,ph.p+d*.05)):Math.max(5,Math.min(95,ph.p+d*5));

function commit(){const p=ph;ph=null;const g=$('#ghost');if(g)g.remove();sync();
 if(p.v){const a=D.cols[p.i],w=a.w;a.w=w*p.p;D.cols.splice(p.i+1,0,{w:w*(1-p.p),top:'',bot:''})}else D.h=p.p;
 grid(p.i,p.part);save()}
